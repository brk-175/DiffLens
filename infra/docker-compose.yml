version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: difflens-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
  
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: difflens-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - difflens_minio_data:/data

  redis:
    image: redis:7
    container_name: difflens-redis
    ports:
      - "6379:6379"

  worker:
    build:
      context: ../api
      dockerfile: Dockerfile.worker
    container_name: difflens-worker
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - postgres
      - minio
      - redis
    env_file:
      - .env
    volumes:
      - ../api:/app
    restart: on-failure

volumes:
  db_data:
  difflens_minio_data:
